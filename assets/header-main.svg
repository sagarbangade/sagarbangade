<svg xmlns="http://www.w3.org/2000/svg" width="850" height="250" viewBox="0 0 850 250">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    
    <!-- Sun Gradient -->
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FE3C01"/>
      <stop offset="50%" stop-color="#ff7f00"/>
      <stop offset="100%" stop-color="#e6b400"/>
    </linearGradient>
    
    <!-- Grid Gradient -->
    <linearGradient id="gridGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FE3C01" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FE3C01" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FE3C01" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes moveGrid {
      0% { transform: translateY(-30px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); transform-origin: center; }
      50% { opacity: 0.85; transform: scale(1.02); transform-origin: center; }
    }
    @keyframes scanline {
      0% { transform: translateY(-250px); opacity: 0.15; }
      100% { transform: translateY(250px); opacity: 0.15; }
    }
    .grid-h {
      stroke: #FE3C01;
      stroke-width: 1.5;
      animation: moveGrid 1.5s linear infinite;
    }
    .grid-v {
      stroke: #FE3C01;
      stroke-width: 1.5;
    }
    .sun {
      animation: pulse 4s ease-in-out infinite;
    }
    .scan {
      animation: scanline 6s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="850" height="250" fill="url(#bg)"/>

  <!-- Cyberpunk Sun -->
  <circle cx="425" cy="150" r="75" fill="url(#sun)" class="sun" filter="url(#glow)"/>
  
  <!-- Sun Cutouts -->
  <rect x="340" y="155" width="170" height="3" fill="#161b22"/>
  <rect x="330" y="165" width="190" height="5" fill="#161b22"/>
  <rect x="320" y="177" width="210" height="7" fill="#161b22"/>
  <rect x="310" y="191" width="230" height="10" fill="#161b22"/>
  <rect x="300" y="208" width="250" height="14" fill="#161b22"/>

  <!-- Perspective Grid (using a clipPath to simulate movement) -->
  <g transform="translate(0, 150)">
    <rect width="850" height="100" fill="url(#gridGlow)"/>
    
    <!-- Horizon Line -->
    <line x1="0" y1="0" x2="850" y2="0" stroke="#FE3C01" stroke-width="3" filter="url(#glow)"/>
    
    <g class="grid-v">
      <!-- Vertical lines spreading outward -->
      <line x1="425" y1="0" x2="425" y2="150"/>
      <line x1="425" y1="0" x2="225" y2="150"/>
      <line x1="425" y1="0" x2="625" y2="150"/>
      <line x1="425" y1="0" x2="25" y2="150"/>
      <line x1="425" y1="0" x2="825" y2="150"/>
      <line x1="425" y1="0" x2="-175" y2="150"/>
      <line x1="425" y1="0" x2="1025" y2="150"/>
      <line x1="425" y1="0" x2="-375" y2="150"/>
      <line x1="425" y1="0" x2="1225" y2="150"/>
      <line x1="425" y1="0" x2="-575" y2="150"/>
      <line x1="425" y1="0" x2="1425" y2="150"/>
    </g>

    <g class="grid-h">
      <!-- Horizontal lines (moving down) -->
      <line x1="-200" y1="0" x2="1050" y2="0"/>
      <line x1="-200" y1="8" x2="1050" y2="8"/>
      <line x1="-200" y1="20" x2="1050" y2="20"/>
      <line x1="-200" y1="36" x2="1050" y2="36"/>
      <line x1="-200" y1="56" x2="1050" y2="56"/>
      <line x1="-200" y1="80" x2="1050" y2="80"/>
      <line x1="-200" y1="110" x2="1050" y2="110"/>
      <line x1="-200" y1="146" x2="1050" y2="146"/>
    </g>
  </g>

  <!-- Title Text -->
  <text x="425" y="45" fill="#FE3C01" font-family="'Courier New', monospace" font-size="24" font-weight="bold" text-anchor="middle" filter="url(#glow)">SYSTEM.INITIALIZED</text>
  <text x="425" y="65" fill="#e6b400" font-family="'Courier New', monospace" font-size="12" text-anchor="middle">> UPLINK ESTABLISHED_</text>
  
  <text x="425" y="105" fill="#C9D1D9" font-family="'Courier New', monospace" font-size="28" font-weight="bold" text-anchor="middle" letter-spacing="6">SAGAR BANGADE</text>
  
  <!-- Scanline Overlay -->
  <rect class="scan" width="850" height="2" fill="#FE3C01"/>
  
  <!-- Corners -->
  <path d="M 10 30 L 10 10 L 30 10" fill="none" stroke="#FE3C01" stroke-width="2"/>
  <path d="M 840 30 L 840 10 L 820 10" fill="none" stroke="#FE3C01" stroke-width="2"/>
  <path d="M 10 220 L 10 240 L 30 240" fill="none" stroke="#FE3C01" stroke-width="2"/>
  <path d="M 840 220 L 840 240 L 820 240" fill="none" stroke="#FE3C01" stroke-width="2"/>
</svg>
