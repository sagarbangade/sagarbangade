<svg xmlns="http://www.w3.org/2000/svg" width="850" height="50" viewBox="0 0 850 50">
  <defs>
    <linearGradient id="qg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="15%" style="stop-color:#FE3C01;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#e6b400;stop-opacity:0.5"/>
      <stop offset="85%" style="stop-color:#FE3C01;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}.p{animation:pulse 4s ease-in-out infinite}</style>
  <rect width="850" height="50" fill="#0D1117"/>
  <line x1="30" y1="25" x2="280" y2="25" stroke="url(#qg)" stroke-width="1" class="p"/>
  <line x1="570" y1="25" x2="820" y2="25" stroke="url(#qg)" stroke-width="1" class="p"/>
  <text x="425" y="22" fill="#e6b400" font-family="'Courier New',monospace" font-size="11" text-anchor="middle" filter="url(#g)" class="p">「 諦めないのが俺の忍道だ 」</text>
  <text x="425" y="40" fill="#8B949E" font-family="'Courier New',monospace" font-size="9" text-anchor="middle">// "I will never give up. That is my ninja way." - Naruto Uzumaki</text>
</svg>