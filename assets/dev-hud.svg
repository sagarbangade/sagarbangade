<svg xmlns="http://www.w3.org/2000/svg" width="850" height="340" viewBox="0 0 850 340">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FE3C01;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#FF6B35;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FE3C01;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(-10px); opacity: 0.3; }
      50% { opacity: 0.15; }
      100% { transform: translateY(340px); opacity: 0.3; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes borderGlow {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 1; }
    }
    @keyframes typewriter1 { from { width: 0; } to { width: 280px; } }
    @keyframes typewriter2 { from { width: 0; } to { width: 340px; } }
    @keyframes typewriter3 { from { width: 0; } to { width: 220px; } }
    @keyframes typewriter4 { from { width: 0; } to { width: 300px; } }
    @keyframes dataStream {
      0% { opacity: 0; transform: translateY(5px); }
      10% { opacity: 1; transform: translateY(0); }
      90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-5px); }
    }
    .scanline-bar {
      animation: scanline 4s linear infinite;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    .border-glow {
      animation: borderGlow 3s ease-in-out infinite;
    }
    .line1 { animation: fadeIn 0.5s ease-out 0.2s both; }
    .line2 { animation: fadeIn 0.5s ease-out 0.5s both; }
    .line3 { animation: fadeIn 0.5s ease-out 0.8s both; }
    .line4 { animation: fadeIn 0.5s ease-out 1.1s both; }
    .line5 { animation: fadeIn 0.5s ease-out 1.4s both; }
    .line6 { animation: fadeIn 0.5s ease-out 1.7s both; }
    .line7 { animation: fadeIn 0.5s ease-out 2.0s both; }
    .line8 { animation: fadeIn 0.5s ease-out 2.3s both; }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; }
    .data1 { animation: dataStream 6s ease-in-out infinite; }
    .data2 { animation: dataStream 6s ease-in-out 1s infinite; }
    .data3 { animation: dataStream 6s ease-in-out 2s infinite; }
  </style>

  <!-- Background -->
  <rect width="850" height="340" rx="16" fill="#0D1117"/>

  <!-- Animated border -->
  <rect x="2" y="2" width="846" height="336" rx="15" fill="none" stroke="url(#neonGlow)" stroke-width="1.5" class="border-glow"/>

  <!-- Corner decorations -->
  <path d="M 20 8 L 8 8 L 8 20" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#glow)"/>
  <path d="M 830 8 L 842 8 L 842 20" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#glow)"/>
  <path d="M 20 332 L 8 332 L 8 320" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#glow)"/>
  <path d="M 830 332 L 842 332 L 842 320" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#glow)"/>

  <!-- Scanline effect -->
  <rect class="scanline-bar" x="0" y="0" width="850" height="3" fill="#FE3C01" opacity="0.15" rx="1"/>

  <!-- Header bar -->
  <rect x="20" y="16" width="810" height="32" rx="4" fill="#161B22" stroke="#FE3C01" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="38" cy="32" r="5" fill="#FE3C01" class="pulse-dot"/>
  <circle cx="56" cy="32" r="5" fill="#FF6B35" opacity="0.6"/>
  <circle cx="74" cy="32" r="5" fill="#e6b400" opacity="0.6"/>
  <text x="425" y="37" fill="#FE3C01" font-family="'Courier New', monospace" font-size="13" text-anchor="middle" font-weight="bold" filter="url(#glow)">⟨ DEVELOPER INTERFACE ∥ サガル・バンガデ ⟩</text>

  <!-- Left panel - Identity -->
  <rect x="20" y="58" width="400" height="270" rx="6" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
  <rect x="20" y="58" width="400" height="24" rx="6" fill="#161B22"/>
  <text x="35" y="74" fill="#8B949E" font-family="'Courier New', monospace" font-size="11">█ SYSTEM.PROFILE</text>

  <!-- Identity lines -->
  <text class="line1" x="35" y="105" fill="#FE3C01" font-family="'Courier New', monospace" font-size="13" filter="url(#glow)">▸ DESIGNATION</text>
  <text class="line1" x="195" y="105" fill="#E6EDF3" font-family="'Courier New', monospace" font-size="13">Sagar Eknath Bangade</text>

  <text class="line2" x="35" y="132" fill="#FE3C01" font-family="'Courier New', monospace" font-size="13" filter="url(#glow)">▸ CLASS</text>
  <text class="line2" x="195" y="132" fill="#E6EDF3" font-family="'Courier New', monospace" font-size="13">Full Stack Engineer</text>

  <text class="line3" x="35" y="159" fill="#FE3C01" font-family="'Courier New', monospace" font-size="13" filter="url(#glow)">▸ GUILD</text>
  <text class="line3" x="195" y="159" fill="#E6EDF3" font-family="'Courier New', monospace" font-size="13">InspironLabs Pvt. Ltd.</text>

  <text class="line4" x="35" y="186" fill="#FE3C01" font-family="'Courier New', monospace" font-size="13" filter="url(#glow)">▸ ORIGIN</text>
  <text class="line4" x="195" y="186" fill="#E6EDF3" font-family="'Courier New', monospace" font-size="13">Bengaluru, India 🇮🇳</text>

  <text class="line5" x="35" y="213" fill="#FE3C01" font-family="'Courier New', monospace" font-size="13" filter="url(#glow)">▸ TRAINING ARC</text>
  <text class="line5" x="195" y="213" fill="#E6EDF3" font-family="'Courier New', monospace" font-size="13">B.Tech, Artificial Intelligence</text>

  <!-- Status indicator -->
  <text class="line6" x="35" y="248" fill="#FE3C01" font-family="'Courier New', monospace" font-size="13" filter="url(#glow)">▸ STATUS</text>
  <circle class="pulse-dot" cx="205" cy="244" r="4" fill="#2ea043"/>
  <text class="line6" x="215" y="248" fill="#2ea043" font-family="'Courier New', monospace" font-size="13">ONLINE — Open to collab</text>

  <!-- Blinking cursor -->
  <rect class="cursor line7" x="35" y="270" width="8" height="16" fill="#FE3C01" filter="url(#glow)"/>
  <text class="line7" x="50" y="283" fill="#8B949E" font-family="'Courier New', monospace" font-size="12" opacity="0.6">ready_for_next_mission...</text>

  <!-- Right panel - Skills -->
  <rect x="430" y="58" width="400" height="270" rx="6" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
  <rect x="430" y="58" width="400" height="24" rx="6" fill="#161B22"/>
  <text x="445" y="74" fill="#8B949E" font-family="'Courier New', monospace" font-size="11">█ ABILITY.MATRIX</text>

  <!-- Skill bars with levels -->
  <text class="line1" x="445" y="105" fill="#e6b400" font-family="'Courier New', monospace" font-size="12">⚔️ FRONTEND MASTERY</text>
  <rect x="445" y="112" width="370" height="6" rx="3" fill="#21262D"/>
  <rect x="445" y="112" width="345" height="6" rx="3" fill="#FE3C01" filter="url(#glow)" class="line1"/>
  <text class="line1" x="795" y="120" fill="#8B949E" font-family="'Courier New', monospace" font-size="9" text-anchor="end">93%</text>

  <text class="line2" x="445" y="140" fill="#e6b400" font-family="'Courier New', monospace" font-size="12">🛡️ BACKEND POWER</text>
  <rect x="445" y="147" width="370" height="6" rx="3" fill="#21262D"/>
  <rect x="445" y="147" width="315" height="6" rx="3" fill="#FF6B35" filter="url(#glow)" class="line2"/>
  <text class="line2" x="795" y="155" fill="#8B949E" font-family="'Courier New', monospace" font-size="9" text-anchor="end">85%</text>

  <text class="line3" x="445" y="175" fill="#e6b400" font-family="'Courier New', monospace" font-size="12">☁️ CLOUD JUTSU</text>
  <rect x="445" y="182" width="370" height="6" rx="3" fill="#21262D"/>
  <rect x="445" y="182" width="296" height="6" rx="3" fill="#e6b400" filter="url(#glow)" class="line3"/>
  <text class="line3" x="795" y="190" fill="#8B949E" font-family="'Courier New', monospace" font-size="9" text-anchor="end">80%</text>

  <text class="line4" x="445" y="210" fill="#e6b400" font-family="'Courier New', monospace" font-size="12">🧠 AI / ML CHAKRA</text>
  <rect x="445" y="217" width="370" height="6" rx="3" fill="#21262D"/>
  <rect x="445" y="217" width="259" height="6" rx="3" fill="#58A6FF" filter="url(#glow)" class="line4"/>
  <text class="line4" x="795" y="225" fill="#8B949E" font-family="'Courier New', monospace" font-size="9" text-anchor="end">70%</text>

  <text class="line5" x="445" y="245" fill="#e6b400" font-family="'Courier New', monospace" font-size="12">🏗️ SYSTEM DESIGN</text>
  <rect x="445" y="252" width="370" height="6" rx="3" fill="#21262D"/>
  <rect x="445" y="252" width="278" height="6" rx="3" fill="#BC8CFF" filter="url(#glow)" class="line5"/>
  <text class="line5" x="795" y="260" fill="#8B949E" font-family="'Courier New', monospace" font-size="9" text-anchor="end">75%</text>

  <!-- Signature -->
  <text class="line8 data1" x="445" y="295" fill="#8B949E" font-family="'Courier New', monospace" font-size="10" opacity="0.5">「 コードは私の忍道 」</text>
  <text class="line8 data2" x="620" y="295" fill="#8B949E" font-family="'Courier New', monospace" font-size="10" opacity="0.5">// Code is my ninja way</text>

  <!-- Hex decoration -->
  <text x="790" y="320" fill="#21262D" font-family="'Courier New', monospace" font-size="9" text-anchor="end">0xSAGAR</text>
</svg>
