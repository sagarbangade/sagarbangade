<svg xmlns="http://www.w3.org/2000/svg" width="850" height="220" viewBox="0 0 850 220">
  <defs>
    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FE3C01;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FE3C01;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes borderGlow{0%,100%{stroke-opacity:.3}50%{stroke-opacity:.8}}
    .c1{animation:fadeIn .6s ease-out .2s both}
    .c2{animation:fadeIn .6s ease-out .5s both}
    .bg{animation:borderGlow 3s ease-in-out infinite}
  </style>

  <rect width="850" height="220" rx="12" fill="#0D1117"/>
  <rect x="1" y="1" width="848" height="218" rx="11" fill="none" stroke="url(#ng)" stroke-width="1" class="bg"/>
  <path d="M 14 5 L 5 5 L 5 14" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#g)"/>
  <path d="M 836 5 L 845 5 L 845 14" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#g)"/>
  <path d="M 14 215 L 5 215 L 5 206" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#g)"/>
  <path d="M 836 215 L 845 215 L 845 206" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#g)"/>

  <!-- Project 1 -->
  <rect class="c1" x="20" y="18" width="395" height="184" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1"/>
  <text class="c1" x="40" y="48" fill="#FE3C01" font-family="'Courier New',monospace" font-size="15" font-weight="bold" filter="url(#g)">🏥 HEALTHCARE PLATFORM 2.0</text>
  <text class="c1" x="40" y="70" fill="#e6b400" font-family="'Courier New',monospace" font-size="10">React · Next.js · Module Federation · Storybook · MUI</text>
  <line class="c1" x1="40" y1="80" x2="395" y2="80" stroke="#21262D" stroke-width="1"/>
  <text class="c1" x="40" y="100" fill="#C9D1D9" font-family="'Courier New',monospace" font-size="11">Migrated legacy healthcare app to a</text>
  <text class="c1" x="40" y="116" fill="#C9D1D9" font-family="'Courier New',monospace" font-size="11">micro-frontend architecture. Each module</text>
  <text class="c1" x="40" y="132" fill="#C9D1D9" font-family="'Courier New',monospace" font-size="11">scales and deploys independently.</text>
  <text class="c1" x="40" y="155" fill="#C9D1D9" font-family="'Courier New',monospace" font-size="11">Built shared Storybook component library</text>
  <text class="c1" x="40" y="171" fill="#C9D1D9" font-family="'Courier New',monospace" font-size="11">for cross-team design consistency.</text>
  <rect class="c1" x="40" y="182" width="120" height="14" rx="3" fill="#FE3C01" opacity="0.15"/>
  <text class="c1" x="48" y="193" fill="#FE3C01" font-family="'Courier New',monospace" font-size="9">MICRO-FRONTENDS</text>
  <rect class="c1" x="170" y="182" width="105" height="14" rx="3" fill="#FE3C01" opacity="0.15"/>
  <text class="c1" x="178" y="193" fill="#FE3C01" font-family="'Courier New',monospace" font-size="9">DESIGN SYSTEM</text>

  <!-- Project 2 -->
  <rect class="c2" x="435" y="18" width="395" height="184" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1"/>
  <text class="c2" x="455" y="48" fill="#FE3C01" font-family="'Courier New',monospace" font-size="15" font-weight="bold" filter="url(#g)">🎓 E-LEARNING PLATFORM</text>
  <text class="c2" x="455" y="70" fill="#e6b400" font-family="'Courier New',monospace" font-size="10">Node.js · Python · PHP · AWS Lambda · MySQL · Serverless</text>
  <line class="c2" x1="455" y1="80" x2="810" y2="80" stroke="#21262D" stroke-width="1"/>
  <text class="c2" x="455" y="100" fill="#C9D1D9" font-family="'Courier New',monospace" font-size="11">Shipped features for large-scale</text>
  <text class="c2" x="455" y="116" fill="#C9D1D9" font-family="'Courier New',monospace" font-size="11">e-learning platform while modernizing</text>
  <text class="c2" x="455" y="132" fill="#C9D1D9" font-family="'Courier New',monospace" font-size="11">legacy codebases across 3 runtimes.</text>
  <text class="c2" x="455" y="155" fill="#C9D1D9" font-family="'Courier New',monospace" font-size="11">Built AWS Lambda functions feeding a</text>
  <text class="c2" x="455" y="171" fill="#C9D1D9" font-family="'Courier New',monospace" font-size="11">scalable serverless architecture.</text>
  <rect class="c2" x="455" y="182" width="85" height="14" rx="3" fill="#FE3C01" opacity="0.15"/>
  <text class="c2" x="463" y="193" fill="#FE3C01" font-family="'Courier New',monospace" font-size="9">SERVERLESS</text>
  <rect class="c2" x="550" y="182" width="140" height="14" rx="3" fill="#FE3C01" opacity="0.15"/>
  <text class="c2" x="558" y="193" fill="#FE3C01" font-family="'Courier New',monospace" font-size="9">LEGACY MODERNIZATION</text>
</svg>