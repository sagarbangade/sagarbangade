<svg xmlns="http://www.w3.org/2000/svg" width="850" height="280" viewBox="0 0 850 280">
  <defs>
    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FE3C01;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FE3C01;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    @keyframes fadeIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    @keyframes borderGlow{0%,100%{stroke-opacity:.3}50%{stroke-opacity:.8}}
    .f1{animation:fadeIn .5s ease-out .2s both}
    .f2{animation:fadeIn .5s ease-out .6s both}
    .f3{animation:fadeIn .5s ease-out 1s both}
    .pd{animation:pulse 2s ease-in-out infinite}
    .bg{animation:borderGlow 3s ease-in-out infinite}
  </style>

  <rect width="850" height="280" rx="12" fill="#0D1117"/>
  <rect x="1" y="1" width="848" height="278" rx="11" fill="none" stroke="url(#ng)" stroke-width="1" class="bg"/>
  <path d="M 14 5 L 5 5 L 5 14" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#g)"/>
  <path d="M 836 5 L 845 5 L 845 14" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#g)"/>
  <path d="M 14 275 L 5 275 L 5 266" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#g)"/>
  <path d="M 836 275 L 845 275 L 845 266" fill="none" stroke="#FE3C01" stroke-width="2" filter="url(#g)"/>

  <!-- Entry 1 -->
