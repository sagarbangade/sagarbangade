  <text class="f1" x="310" y="42" fill="#8B949E" font-family="'Courier New',monospace" font-size="11">InspironLabs Pvt. Ltd. · Bengaluru</text>
  <text class="f1" x="700" y="42" fill="#e6b400" font-family="'Courier New',monospace" font-size="11" text-anchor="end">04/2025 → PRESENT</text>
  <text class="f1" x="750" y="42" fill="#2ea043" font-family="'Courier New',monospace" font-size="10" font-weight="bold">● ACTIVE</text>
